<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/login/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/login/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/login/apple-touch-icon.png" />
  <link rel="manifest" href="/login/manifest-volunteer.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="JewelHeart" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#92160e" />
  <title>Jewel Heart Volunteers (dev)</title>
  <!-- deploy-marker: dev-volunteer -->
  <link rel="canonical" href="https://api-dev.karmadots.org/login/volunteer.html" />
  <link rel="stylesheet" href="jewelheart-admin.css?v=__JH_WEB_BUILD__" />
  <style>
    body.jh-volunteer-auth {
      background: var(--bg);
    }
    body.jh-volunteer-auth main {
      max-width: 100%;
      margin: 0 auto;
      padding: 0 0 2rem;
    }
    .jh-vol-header .jh-bar {
      width: 100%;
      max-width: none;
    }
    .jh-vol-header .jh-bar-retreat {
      color: var(--jh-gold);
    }
    .jh-vol-header .jh-bar-retreat h1 {
      color: var(--jh-gold);
    }
    /* —— Sign-in screen (sign-in screen spec.docx) —— */
    .jh-signin-screen {
      padding: 0;
    }
    .jh-signin-bar {
      width: 100%;
    }
    .jh-signin-body {
      padding: var(--jh-gap) var(--jh-page-pad) 0;
      text-align: left;
    }
    .jh-signin-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 0.45rem;
      margin-top: var(--jh-gap);
    }
    .jh-signin-btn {
      width: auto;
      min-width: 0;
      margin: 0;
      background: var(--jh-maroon);
      color: #fff;
    }
    .jh-signin-btn.jh-signin-btn-inactive,
    .jh-signin-btn:disabled {
      background: var(--jh-maroon-light);
      color: #fff;
      opacity: 1;
      cursor: not-allowed;
      box-shadow: none;
    }
    .jh-signin-input {
      width: 15ch;
      max-width: 100%;
      box-sizing: content-box;
      background: #e8e8e8;
      color: #1a1a1a;
      border: 1px solid #c5c5c5;
      border-radius: 0;
      min-height: var(--jh-bar-h);
      padding: 6px 8px;
      font-size: var(--jh-bar-font);
      font-weight: 600;
      text-align: left;
      box-shadow: none;
    }
    .jh-signin-input::placeholder {
      color: #444;
    }
    .jh-signin-input:focus {
      outline: 2px solid var(--jh-blue);
      outline-offset: 0;
    }
    .jh-signin-sent {
      margin: var(--jh-gap) var(--jh-page-pad) 0;
      font-weight: 700;
      line-height: 1.35;
      text-align: left;
    }
    .jh-signin-msg {
      margin: 0.35rem var(--jh-page-pad) 0;
      text-align: left;
      white-space: pre-wrap;
    }

    /* —— Onboarding screen (placeholder until separate spec) —— */
    .jh-vol-screen {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.55rem;
      text-align: left;
      padding: var(--jh-gap) var(--jh-page-pad) 0;
    }
    .jh-vol-screen .jh-bar {
      width: 100%;
      max-width: none;
      align-self: stretch;
    }
    .jh-vol-input {
      background: #e8e8e8;
      color: #1a1a1a;
      border: 1px solid #c5c5c5;
      border-radius: 0;
      min-height: var(--jh-bar-h);
      padding: 6px 10px;
      font-size: var(--jh-bar-font);
      font-weight: 600;
      text-align: left;
      box-shadow: none;
    }
    .jh-vol-input::placeholder {
      color: #444;
    }
    .jh-vol-field {
      width: auto;
      min-width: 0;
      max-width: 20rem;
    }
    .jh-vol-field-15 {
      width: 15ch;
      max-width: 100%;
      box-sizing: content-box;
    }
    .jh-vol-name-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: center;
      gap: 0.45rem;
      width: 100%;
    }
    .jh-vol-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: center;
      gap: 0.45rem;
      width: 100%;
    }
    .jh-vol-email-display {
      font-size: var(--jh-bar-font);
      font-weight: 600;
      word-break: break-all;
    }
    .jh-env-badge {
      display: inline-block;
      margin: 0.35rem auto 0;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #bfdbfe;
      background: rgba(37, 99, 235, 0.22);
      border: 1px solid rgba(59, 130, 246, 0.45);
    }
    .jh-invite-banner {
      width: 100%;
      max-width: 24rem;
      margin-bottom: 0.35rem;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      background: rgba(122, 149, 202, 0.15);
      border: 1px solid rgba(122, 149, 202, 0.45);
      font-size: 0.82rem;
      text-align: left;
    }
    .jh-invite-banner.err {
      background: rgba(204, 0, 0, 0.08);
      border-color: rgba(204, 0, 0, 0.35);
      color: var(--jh-error);
    }
    #volunteer-sdui-section.panel {
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
    }
    .jh-dev-tools {
      position: fixed;
      bottom: 0.4rem;
      left: 0.4rem;
      z-index: 120;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.3rem;
      max-width: min(14rem, calc(100vw - 1rem));
    }
    .jh-dev-tools button {
      font-size: 0.68rem;
      min-height: 32px;
      padding: 4px 10px;
      margin: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .jh-dev-tools-hint {
      font-size: 0.65rem;
      line-height: 1.35;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.45rem;
      max-width: 14rem;
    }
  </style>
</head>
<body class="jh-volunteer-clean jh-volunteer-auth">
  <header id="vol-screen-header" class="jh-top-bars jh-vol-header">
    <div class="jh-bar jh-bar-blue jh-bar-retreat"><h1>Jewel Heart Volunteers</h1></div>
    <p class="jh-env-badge" aria-label="Environment">Dev</p>
  </header>

  <main>
    <section id="auth-panel" class="jh-signin-screen">
      <div class="jh-bar jh-bar-blue jh-signin-bar">Choose sign-in method:</div>
      <div class="jh-signin-body">
        <div id="invite-banner" class="jh-invite-banner" hidden aria-live="polite"></div>

        <div class="jh-signin-row">
          <button type="button" id="btn-google" class="jh-signin-btn">By Google</button>
        </div>

        <div class="jh-signin-row">
          <button type="button" id="btn-email-link" class="jh-signin-btn jh-signin-btn-inactive" disabled>By email</button>
          <input
            type="email"
            id="auth-email"
            class="jh-signin-input"
            placeholder="Email address"
            autocomplete="email"
            inputmode="email"
            spellcheck="false"
          />
        </div>
      </div>

      <p id="email-sent-msg" class="jh-signin-sent" hidden aria-live="polite"></p>
      <div class="msg jh-signin-msg" id="auth-msg" aria-live="polite"></div>
    </section>

    <section id="onboarding-panel" class="jh-vol-screen" hidden>
      <div class="jh-bar jh-bar-blue">App onboard (NOT retreat registration)</div>

      <div class="jh-vol-name-row">
        <input type="text" id="ob-first" class="jh-vol-input jh-vol-field-15" placeholder="First name…" autocomplete="given-name" maxlength="15" />
        <input type="text" id="ob-last" class="jh-vol-input jh-vol-field-15" placeholder="Last name…" autocomplete="family-name" maxlength="15" />
      </div>

      <p class="jh-vol-email-display" id="ob-email-display"></p>

      <button type="button" id="btn-ob-save">Continue</button>
      <button type="button" id="btn-ob-out" class="secondary small">Sign out</button>
      <div class="msg" id="onboarding-msg" aria-live="polite"></div>
    </section>

    <section class="panel" id="volunteer-sdui-section" hidden>
      <div class="jh-sdui-toolbar">
        <button type="button" id="sdui-back" class="secondary small" hidden>Back</button>
        <span id="sdui-title">JewelHeart</span>
        <div class="jh-sdui-toolbar-actions">
          <button type="button" id="btn-out" class="secondary">Sign out</button>
        </div>
      </div>
      <div id="sdui-root" class="jh-sdui-root" aria-live="polite"></div>
      <p id="sdui-build-stamp" class="jh-sdui-build-stamp" aria-label="Build version">web … · api …</p>
      <div class="msg" id="sdui-msg" aria-live="polite"></div>
    </section>
  </main>

  <div class="jh-dev-tools" id="jh-dev-tools" aria-label="Dev testing tools">
    <button type="button" id="btn-dev-restore-admin" class="secondary small" hidden>Restore admin (Google)</button>
    <p class="jh-dev-tools-hint" id="jh-dev-tools-hint" hidden></p>
  </div>

  <script type="module">
    import { createVolunteerSduiController, JH_LOGIN_WEB_BUILD } from './jewelheart-sdui.js?v=__JH_WEB_BUILD__';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
      sendSignInLinkToEmail,
      isSignInWithEmailLink,
      signInWithEmailLink,
      setPersistence,
      browserLocalPersistence,
    } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyAd7WirDcLLX9bl1BY4uAhjiXEvpB-HiFw',
      authDomain: 'login.karmadots.org',
      projectId: 'gettingstoned-4aee3',
      storageBucket: 'gettingstoned-4aee3.firebasestorage.app',
      messagingSenderId: '120549448949',
      appId: '1:120549448949:ios:189513e804833eed5db9bc',
    };

    const API =
      (location.hostname.indexOf('api') === 0 ? location.origin : 'https://api-dev.karmadots.org') +
      '/jewelheart';

    const INVITE_STORAGE_KEY = 'jh_volunteer_invite_token';
    const VOLUNTEER_SIGNOUT_KEY = 'jh_volunteer_explicit_signout';
    const EMAIL_LINK_STORAGE_KEY = 'jh_volunteer_email_for_link';
    const DEV_ADMIN_HINT_KEY = 'jh_dev_last_admin_email';
    const MAGIC_LINK_TTL_MINUTES = 60;

    /** @type {{ authEmail?: string, draft?: object } | null} */
    let onboardingState = null;
    /** @type {{ displayName?: string, retreatName?: string } | null} */
    let invitePreview = null;
    let magicLinkHandling = false;
    let authFlowReady = false;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(() => {});

    const volScreenHeader = document.getElementById('vol-screen-header');
    const authPanel = document.getElementById('auth-panel');
    const onboardingPanel = document.getElementById('onboarding-panel');
    const volunteerSduiSection = document.getElementById('volunteer-sdui-section');
    const authMsg = document.getElementById('auth-msg');
    const sduiMsg = document.getElementById('sdui-msg');
    const authEmailInput = document.getElementById('auth-email');
    const btnEmailLink = document.getElementById('btn-email-link');
    const emailSentMsg = document.getElementById('email-sent-msg');
    const btnDevRestoreAdmin = document.getElementById('btn-dev-restore-admin');
    const devToolsHint = document.getElementById('jh-dev-tools-hint');

    const sduiController = createVolunteerSduiController({
      apiBase: API,
      getIdToken: () => getBearerToken(),
      rootEl: document.getElementById('sdui-root'),
      titleEl: document.getElementById('sdui-title'),
      msgEl: sduiMsg,
      backBtn: document.getElementById('sdui-back'),
      buildStampEl: document.getElementById('sdui-build-stamp'),
      uiChannel: 'testers',
    });
    {
      const bs0 = document.getElementById('sdui-build-stamp');
      if (bs0) bs0.textContent = `web ${JH_LOGIN_WEB_BUILD} · api …`;
    }

    function magicLinkContinueUrl() {
      const params = new URLSearchParams(window.location.search);
      params.delete('invite');
      const qs = params.toString();
      return `${window.location.origin}${window.location.pathname}${qs ? `?${qs}` : ''}`;
    }

    function normalizeEmailLocal(raw) {
      const s = String(raw || '').trim().toLowerCase();
      return s && s.includes('@') ? s : '';
    }

    function isValidEmailFormat(raw) {
      const s = normalizeEmailLocal(raw);
      if (!s) return false;
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
    }

    function describeEmailError(raw) {
      const s = String(raw || '').trim();
      if (!s) return 'Enter your email address.';
      if (/\s/.test(s)) return 'Error: remove spaces from the email address, fix & retry.';
      if (!s.includes('@')) return 'Error: email address must include @, fix & retry.';
      const parts = s.split('@');
      if (parts.length !== 2 || !parts[0] || !parts[1]) {
        return 'Error: email address format is invalid, fix & retry.';
      }
      if (!parts[1].includes('.')) {
        return 'Error: domain looks incomplete (missing .), fix & retry.';
      }
      if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.toLowerCase())) return '';
      return 'Error: email address format is invalid, fix & retry.';
    }

    function refreshEmailButtonState() {
      const valid = isValidEmailFormat(authEmailInput.value);
      btnEmailLink.disabled = !valid;
      btnEmailLink.classList.toggle('jh-signin-btn-inactive', !valid);
    }

    function formatMagicLinkExpiryMinutes() {
      return `${MAGIC_LINK_TTL_MINUTES} minutes`;
    }

    function setEmailSentUi(email) {
      emailSentMsg.hidden = false;
      emailSentMsg.textContent = `Email sent, click link in it, expires ${formatMagicLinkExpiryMinutes()}`;
      authEmailInput.value = email;
      refreshEmailButtonState();
    }

    function clearEmailSentUi() {
      emailSentMsg.hidden = true;
      emailSentMsg.textContent = '';
    }

    function setAuthMsg(text, err) {
      authMsg.textContent = text || '';
      authMsg.className = 'msg' + (err ? ' err' : text ? ' ok' : '');
    }

    function setOnboardingMsg(text, isErr = false) {
      const el = document.getElementById('onboarding-msg');
      if (!el) return;
      el.textContent = text || '';
      el.className = 'msg' + (isErr ? ' err' : text ? ' ok' : '');
    }

    function normalizePhoneE164(raw) {
      const digits = String(raw || '').replace(/\D/g, '');
      if (!digits) return null;
      if (String(raw).trim().startsWith('+')) return `+${digits}`;
      if (digits.length === 10) return `+1${digits}`;
      if (digits.length === 11 && digits.startsWith('1')) return `+${digits}`;
      return `+${digits}`;
    }

    function clearLegacyKeycloakSession() {
      sessionStorage.removeItem('jh_keycloak_session');
      sessionStorage.removeItem('jh_kc_oauth_state');
    }

    function loadStoredInviteToken() {
      try {
        return sessionStorage.getItem(INVITE_STORAGE_KEY) || '';
      } catch {
        return '';
      }
    }

    function saveInviteToken(token) {
      const t = String(token || '').trim();
      if (!t) return;
      sessionStorage.setItem(INVITE_STORAGE_KEY, t);
    }

    function clearInviteToken() {
      sessionStorage.removeItem(INVITE_STORAGE_KEY);
    }

    function captureInviteFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const invite = params.get('invite');
      if (!invite) return null;
      saveInviteToken(invite);
      params.delete('invite');
      const qs = params.toString();
      const next = `${window.location.pathname}${qs ? `?${qs}` : ''}`;
      window.history.replaceState({}, document.title, next);
      return invite;
    }

    function setInviteBanner(text, isErr = false) {
      const el = document.getElementById('invite-banner');
      if (!el) return;
      if (!text) {
        el.hidden = true;
        el.textContent = '';
        el.classList.remove('err');
        return;
      }
      el.hidden = false;
      el.textContent = text;
      el.classList.toggle('err', isErr);
    }

    async function fetchInvitePreview(token) {
      const res = await fetch(`${API}/invites/${encodeURIComponent(token)}/preview`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || `Invite preview failed (${res.status})`);
      return data;
    }

    async function initInviteBanner() {
      captureInviteFromUrl();
      const token = loadStoredInviteToken();
      if (!token) return;
      try {
        invitePreview = await fetchInvitePreview(token);
        if (invitePreview.status === 'active') {
          const who = invitePreview.displayName || 'you';
          const retreat = invitePreview.retreatName ? ` (${invitePreview.retreatName})` : '';
          setInviteBanner(`Welcome, ${who}${retreat}. Sign in with Google or email.`);
        } else if (invitePreview.status === 'consumed') {
          clearInviteToken();
          setInviteBanner('You already used your invite. Sign in below with the same email as before.');
        } else if (invitePreview.status === 'expired') {
          clearInviteToken();
          setInviteBanner('This invite link has expired. Ask the organizer for a new QR code.', true);
        } else {
          setInviteBanner('Invite link is not valid. Ask the organizer for a new QR code.', true);
        }
      } catch (e) {
        setInviteBanner(String(e.message || e), true);
      }
    }

    async function apiVolunteerBootstrap(bearer) {
      const res = await fetch(`${API}/volunteer/bootstrap`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${bearer}`, 'Content-Type': 'application/json' },
        body: '{}',
      });
      const data = await res.json().catch(() => ({}));
      return { res, data };
    }

    function fillOnboardingForm(draft) {
      document.getElementById('ob-first').value = draft.firstName || '';
      document.getElementById('ob-last').value = draft.lastName || '';
      document.getElementById('ob-email-display').textContent = draft.authEmail || draft.email || '';
      onboardingState = { authEmail: draft.authEmail || draft.email || '', draft };
    }

    function applyOnboardingUi() {
      if (volScreenHeader) volScreenHeader.hidden = false;
      authPanel.hidden = true;
      onboardingPanel.hidden = false;
      volunteerSduiSection.hidden = true;
      setAuthMsg('');
    }

    async function showOnboardingFromBootstrap(data) {
      fillOnboardingForm(data);
      applyOnboardingUi();
    }

    async function getBearerToken(forceRefresh = false) {
      const user = auth.currentUser;
      if (!user) throw new Error('Not signed in');
      return user.getIdToken(forceRefresh);
    }

    async function completeVolunteerAccess() {
      const bearer = await getBearerToken(false);
      const { res, data } = await apiVolunteerBootstrap(bearer);
      if (!res.ok) throw new Error(data.error || `Bootstrap failed (${res.status})`);
      if (data.profileConfirmed !== true) {
        await showOnboardingFromBootstrap(data);
        return { needsOnboarding: true };
      }
      return data;
    }

    function formatAuthError(e) {
      const code = e && e.code;
      if (code === 'auth/popup-closed-by-user') return '';
      if (code === 'auth/operation-not-allowed') {
        return 'Error: email link sign-in is not enabled in Firebase yet. Ask the organizers.';
      }
      if (code === 'auth/unauthorized-domain') {
        const h = typeof location !== 'undefined' ? location.hostname : 'this site';
        return `Error: ${h} is not an authorized domain in Firebase. Ask the organizers, fix & retry.`;
      }
      if (code === 'auth/invalid-email') {
        return 'Error: email address format is invalid, fix & retry.';
      }
      if (code === 'auth/too-many-requests') {
        return 'Error: too many sign-in attempts. Wait a few minutes, fix & retry.';
      }
      if (code === 'auth/invalid-action-code') {
        return 'Error: sign-in link expired or already used. Request a new link, fix & retry.';
      }
      return e && e.message != null ? `Error: ${String(e.message)}, fix & retry` : String(e);
    }

    function friendlyApiError(e) {
      const m = e && e.message != null ? String(e.message) : String(e);
      const low = m.toLowerCase();
      if (e && e.status === 401) {
        return m + ' If this persists, sign out and sign in again.';
      }
      const looksNetwork =
        (e && e.name === 'TypeError') ||
        low.includes('failed to fetch') ||
        low.includes('load failed') ||
        low.includes('networkerror');
      if (looksNetwork) {
        return `Could not reach ${location.hostname} (network, DNS, VPN, or firewall). Detail: ${m}`;
      }
      return m;
    }

    function applySignedInUi() {
      if (volScreenHeader) volScreenHeader.hidden = true;
      authPanel.hidden = true;
      onboardingPanel.hidden = true;
      volunteerSduiSection.hidden = false;
      setAuthMsg('');
      clearEmailSentUi();
      rememberDevAdminEmail();
      refreshDevToolsUi();
      sduiController.resetHome().catch(async (e) => {
        console.error('sdui home (auth)', e);
        const msg = String(e?.message || e);
        if (/complete volunteer onboarding|not bootstrapped|volunteer session not bootstrapped/i.test(msg)) {
          try {
            const bearer = await getBearerToken(false);
            const { res, data } = await apiVolunteerBootstrap(bearer);
            if (res.ok && data.profileConfirmed !== true) {
              volunteerSduiSection.hidden = true;
              await showOnboardingFromBootstrap(data);
              return;
            }
          } catch (bootErr) {
            console.error('onboarding redirect', bootErr);
          }
        }
        sduiMsg.textContent = friendlyApiError(e);
        sduiMsg.className = 'msg err';
      });
    }

    async function enterVolunteerApp() {
      try {
        const access = await completeVolunteerAccess();
        if (access?.needsOnboarding) return;
        sessionStorage.removeItem(VOLUNTEER_SIGNOUT_KEY);
        applySignedInUi();
      } catch (e) {
        console.error('volunteer access', e);
        setAuthMsg(String(e.message || e), true);
        try {
          await signOut(auth);
        } catch {
          /* ignore */
        }
        markVolunteerSignedOut();
      }
    }

    function applySignedOutUi() {
      if (volScreenHeader) volScreenHeader.hidden = false;
      authPanel.hidden = false;
      onboardingPanel.hidden = true;
      volunteerSduiSection.hidden = true;
      onboardingState = null;
    }

    function rememberDevAdminEmail() {
      const em = normalizeEmailLocal(auth.currentUser?.email);
      if (!em) return;
      try {
        localStorage.setItem(DEV_ADMIN_HINT_KEY, em);
      } catch {
        /* ignore */
      }
      refreshDevToolsUi();
    }

    function devAdminHintEmail() {
      try {
        return localStorage.getItem(DEV_ADMIN_HINT_KEY) || '';
      } catch {
        return '';
      }
    }

    function refreshDevToolsUi() {
      const devToolsEl = document.getElementById('jh-dev-tools');
      const hint = devAdminHintEmail();
      const signedOut = Boolean(sessionStorage.getItem(VOLUNTEER_SIGNOUT_KEY)) || !auth.currentUser;
      if (btnDevRestoreAdmin) {
        btnDevRestoreAdmin.hidden = !(signedOut && hint);
      }
      if (devToolsHint) {
        if (signedOut && hint) {
          devToolsHint.hidden = false;
          devToolsHint.textContent = `Manage/Admin return when you sign in as ${hint} (same Google account as before).`;
        } else {
          devToolsHint.hidden = true;
          devToolsHint.textContent = '';
        }
      }
      if (devToolsEl) devToolsEl.hidden = !(signedOut && hint);
    }

    function clearVolunteerClientState() {
      clearInviteToken();
      localStorage.removeItem(EMAIL_LINK_STORAGE_KEY);
      clearLegacyKeycloakSession();
      onboardingState = null;
      clearEmailSentUi();
      if (authEmailInput) authEmailInput.value = '';
      refreshEmailButtonState();
    }

    function markVolunteerSignedOut() {
      sessionStorage.setItem(VOLUNTEER_SIGNOUT_KEY, '1');
      clearLegacyKeycloakSession();
      applySignedOutUi();
      refreshDevToolsUi();
    }

    async function startOAuthSignIn(provider) {
      setAuthMsg('');
      clearEmailSentUi();
      sessionStorage.removeItem(VOLUNTEER_SIGNOUT_KEY);
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        const msg = formatAuthError(e);
        if (msg) setAuthMsg(msg, true);
      }
    }

    async function sendMagicLink() {
      setAuthMsg('');
      clearEmailSentUi();
      const email = normalizeEmailLocal(authEmailInput.value);
      const fmtErr = describeEmailError(email);
      if (fmtErr) {
        setAuthMsg(fmtErr, true);
        return;
      }
      btnEmailLink.disabled = true;
      try {
        await sendSignInLinkToEmail(auth, email, {
          url: magicLinkContinueUrl(),
          handleCodeInApp: true,
        });
        window.localStorage.setItem(EMAIL_LINK_STORAGE_KEY, email);
        setEmailSentUi(email);
        setAuthMsg('');
      } catch (e) {
        setAuthMsg(formatAuthError(e), true);
      } finally {
        refreshEmailButtonState();
      }
    }

    async function completeMagicLinkIfPresent() {
      if (!isSignInWithEmailLink(auth, window.location.href)) return false;
      magicLinkHandling = true;
      setAuthMsg('Completing sign-in from email link…', false);
      let email = window.localStorage.getItem(EMAIL_LINK_STORAGE_KEY) || normalizeEmailLocal(authEmailInput.value);
      if (!email) {
        email = normalizeEmailLocal(window.prompt('Enter the email address you used for the sign-in link') || '');
      }
      if (!email) {
        setAuthMsg('Error: enter the same email address you used for the link, fix & retry.', true);
        magicLinkHandling = false;
        return false;
      }
      try {
        await signInWithEmailLink(auth, email, window.location.href);
        window.localStorage.removeItem(EMAIL_LINK_STORAGE_KEY);
        window.history.replaceState({}, document.title, magicLinkContinueUrl());
        clearEmailSentUi();
        setAuthMsg('');
        return true;
      } catch (e) {
        setAuthMsg(formatAuthError(e), true);
        return false;
      } finally {
        magicLinkHandling = false;
      }
    }

    document.getElementById('sdui-back').addEventListener('click', () => {
      sduiController.goBack().catch((e) => console.error('sdui back', e));
    });

    document.getElementById('btn-google').addEventListener('click', () => {
      startOAuthSignIn(new GoogleAuthProvider());
    });

    if (btnDevRestoreAdmin) {
      btnDevRestoreAdmin.addEventListener('click', () => {
        const hint = devAdminHintEmail();
        if (hint && authEmailInput) authEmailInput.value = hint;
        refreshEmailButtonState();
        startOAuthSignIn(new GoogleAuthProvider());
      });
    }

    authEmailInput.addEventListener('input', () => {
      clearEmailSentUi();
      refreshEmailButtonState();
      const raw = authEmailInput.value;
      if (!raw.trim()) {
        setAuthMsg('');
        return;
      }
      const err = describeEmailError(raw);
      setAuthMsg(err || '', Boolean(err));
    });

    btnEmailLink.addEventListener('click', () => {
      sendMagicLink();
    });

    document.getElementById('btn-out').addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch {
        /* ignore */
      }
      markVolunteerSignedOut();
    });

    document.getElementById('btn-ob-save').addEventListener('click', async () => {
      setOnboardingMsg('');
      const firstName = document.getElementById('ob-first').value.trim();
      const lastName = document.getElementById('ob-last').value.trim();
      const email = onboardingState?.authEmail || onboardingState?.draft?.authEmail || onboardingState?.draft?.email || '';

      if (!firstName) {
        setOnboardingMsg('Enter your first name.', true);
        return;
      }
      if (!lastName) {
        setOnboardingMsg('Enter your last name.', true);
        return;
      }
      if (firstName.length > 15 || lastName.length > 15) {
        setOnboardingMsg('First and last name must each be 15 characters or fewer.', true);
        return;
      }
      if (!email) {
        setOnboardingMsg('Sign-in email is missing. Sign out and sign in again.', true);
        return;
      }

      try {
        const bearer = await getBearerToken(false);
        const res = await fetch(`${API}/volunteer/onboarding/complete`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${bearer}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName, lastName, email, phone: '' }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        onboardingPanel.hidden = true;
        onboardingState = null;
        sessionStorage.removeItem(VOLUNTEER_SIGNOUT_KEY);
        applySignedInUi();
      } catch (e) {
        setOnboardingMsg(String(e.message || e), true);
      }
    });

    document.getElementById('btn-ob-out').addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch {
        /* ignore */
      }
      markVolunteerSignedOut();
    });

    async function initAuth() {
      clearLegacyKeycloakSession();
      await initInviteBanner();
      refreshEmailButtonState();
      const storedEmail = window.localStorage.getItem(EMAIL_LINK_STORAGE_KEY);
      if (storedEmail && isValidEmailFormat(storedEmail)) {
        authEmailInput.value = storedEmail;
        refreshEmailButtonState();
      }
      await completeMagicLinkIfPresent();
      authFlowReady = true;
      rememberDevAdminEmail();
      refreshDevToolsUi();
    }

    onAuthStateChanged(auth, async (user) => {
      if (!authFlowReady || magicLinkHandling) return;
      if (user) {
        rememberDevAdminEmail();
        refreshDevToolsUi();
        await enterVolunteerApp();
      } else if (!sessionStorage.getItem(VOLUNTEER_SIGNOUT_KEY)) {
        applySignedOutUi();
        refreshDevToolsUi();
      }
    });

    initAuth();
  </script>
</body>
</html>
