  <style>

      width: 100%;

<body class="jh-volunteer-clean jh-volunteer-auth">

    <main>
      <section id="auth-panel" class="jh-signin-screen">

  <script type="module">
    import { createVolunteerSduiController, JH_LOGIN_WEB_BUILD } from '__JH_ASSET_PREFIX__jewelheart-sdui.js?v=__JH_WEB_BUILD__';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
      sendSignInLinkToEmail,
      isSignInWithEmailLink,
      signInWithEmailLink,
      fetchSignInMethodsForEmail,
      setPersistence,
      browserLocalPersistence,
    } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyAd7WirDcLLX9bl1BY4uAhjiXEvpB-HiFw',
      authDomain: 'gettingstoned-4aee3.firebaseapp.com',
      projectId: 'gettingstoned-4aee3',
      storageBucket: 'gettingstoned-4aee3.firebasestorage.app',
      messagingSenderId: '120549448949',
      appId: '1:120549448949:ios:189513e804833eed5db9bc',
    };

    const VOLUNTEER_API_ORIGINS = {
      dev: 'https://api-dev.karmadots.org',
      test: 'https://api-test.karmadots.org',
      retreat: 'https://api.karmadots.org',
    };

    function detectVolunteerEnv() {
      const path = String(location.pathname || '').toLowerCase();
      if (path.includes('/test/') || path.endsWith('/test')) return 'test';
      if (path.includes('/retreat/') || path.endsWith('/retreat')) return 'retreat';
      if (path.includes('/dev/') || path.endsWith('/dev')) return 'dev';
      const host = String(location.hostname || '').toLowerCase();
      if (host.startsWith('api-test.')) return 'test';
      if (host === 'api.karmadots.org') return 'retreat';
      if (host.startsWith('api-dev.')) return 'dev';
      return '__JH_VOLUNTEER_ENV__';
    }

    const volunteerEnv = detectVolunteerEnv();
    const API = (VOLUNTEER_API_ORIGINS[volunteerEnv] || '__JH_API_ORIGIN__') + '/jewelheart';

    const INVITE_STORAGE_KEY = 'jh_volunteer_invite_token';
    const VOLUNTEER_SIGNOUT_KEY = 'jh_volunteer_explicit_signout';
    const EMAIL_LINK_STORAGE_KEY = 'jh_volunteer_email_for_link';
    const DEV_ADMIN_HINT_KEY = 'jh_dev_last_admin_email';
    const MAGIC_LINK_TTL_MINUTES = 60;
    const BUILD_ENV = '__JH_VOLUNTEER_ENV__';
    const VOLUNTEER_UI_CHANNEL = '__JH_UI_CHANNEL__';
    /** Firebase authorized domain for email magic links (often karmadots.org, not api-*). */
    const VOLUNTEER_MAGIC_LINK_CONTINUE = '__JH_MAGIC_LINK_URL__';
    const VOLUNTEER_RETREAT = { startDate: '2026-07-20', endDate: '2026-07-26' };
    /** Matches server VOLUNTEER_HOME_DEMO_DAY_ISO when demo pin is on (testers / dev). */
    const VOLUNTEER_DEMO_DAY_ISO = '2026-07-21';

    /** @type {{ retreatBannerLine?: string, todayIso?: string, testingEnabled?: boolean } | null} */
    let volunteerTimeContext = null;

    function applyVolunteerTimeContext(ctx) {
      if (!ctx || typeof ctx !== 'object') return;
      volunteerTimeContext = ctx;
      refreshVolunteerRetreatHeader();
    }

    async function fetchVolunteerTimeContext() {
      try {
        const res = await fetch(`${API}/volunteer/time-context`);
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.retreatBannerLine) {
          applyVolunteerTimeContext(data);
        }
      } catch {
        /* offline / pre-deploy */
      }
    }

    /** @type {{ authEmail?: string, draft?: object } | null} */
    let onboardingState = null;
    /** @type {{ displayName?: string, retreatName?: string } | null} */
    let invitePreview = null;
    let magicLinkHandling = false;
    let authFlowReady = false;
    /** @type {'google'|'email'} */
    let signInMethod = 'google';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(() => {});

    const volScreenHeader = document.getElementById('vol-screen-header');
    const volRetreatHeader = document.getElementById('vol-retreat-header');
    const authPanel = document.getElementById('auth-panel');
    const onboardingPanel = document.getElementById('onboarding-panel');
    const volunteerSduiSection = document.getElementById('volunteer-sdui-section');
    const authMsg = document.getElementById('auth-msg');
    const sduiMsg = document.getElementById('sdui-msg');
    const authEmailInput = document.getElementById('auth-email');
    const btnMethodGoogle = document.getElementById('method-google');
    const btnMethodEmail = document.getElementById('method-email');
    const btnSignIn = document.getElementById('btn-sign-in');
    const emailRow = document.getElementById('email-row');
    const emailSentMsg = document.getElementById('email-sent-msg');
    const devToolsEl = document.getElementById('jh-dev-tools');
    const btnDevTestNewUser = document.getElementById('btn-dev-test-new-user');
    const btnDevRestoreAdmin = document.getElementById('btn-dev-restore-admin');
    const devToolsHint = document.getElementById('jh-dev-tools-hint');

    const sduiController = createVolunteerSduiController({
      apiBase: API,
      getIdToken: () => getBearerToken(),
      rootEl: document.getElementById('sdui-root'),
      titleEl: document.getElementById('sdui-title'),
      msgEl: sduiMsg,
      backBtn: document.getElementById('sdui-back'),
      buildStampEl: document.getElementById('sdui-build-stamp'),
__JH_UI_CHANNEL_LINE__    });
    {
      const bs0 = document.getElementById('sdui-build-stamp');
      if (bs0) bs0.textContent = `web ${JH_LOGIN_WEB_BUILD} · api …`;
    }

    function localTodayIso() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function retreatSpanCompact(startIso, endIso) {
      const [sy, sm, sd] = startIso.split('-').map((x) => parseInt(x, 10));
      const [, , ed] = endIso.split('-').map((x) => parseInt(x, 10));
      return `${sy}.${sm}.${sd}-${ed}`;
    }

    function dayNumberInRetreat(startIso, contextIso) {
      const [sy, sm, sd] = startIso.split('-').map((x) => parseInt(x, 10));
      const [ty, tm, td] = contextIso.split('-').map((x) => parseInt(x, 10));
      const startMs = Date.UTC(sy, sm - 1, sd);
      const contextMs = Date.UTC(ty, tm - 1, td);
      const diff = Math.floor((contextMs - startMs) / 86400000);
      return Math.max(1, diff + 1);
    }

    function weekdayShortLocal(iso) {
      const [y, m, d] = iso.split('-').map((x) => parseInt(x, 10));
      const dt = new Date(y, m - 1, d);
      return new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(dt);
    }

    /** Dev/test testers channel pins retreat "today" to demo day (server JEWELHEART_VOLUNTEER_HOME_DEMO). */
    function volunteerHeaderPinDemoDay() {
      return VOLUNTEER_UI_CHANNEL === 'testers';
    }

    /** One ISO for both day number and weekday — never mix real calendar day with retreat day index. */
    function volunteerHeaderContextIso(realTodayIso) {
      if (volunteerHeaderPinDemoDay()) return VOLUNTEER_DEMO_DAY_ISO;
      const { startDate, endDate } = VOLUNTEER_RETREAT;
      if (realTodayIso < startDate) return startDate;
      if (realTodayIso > endDate) return endDate;
      return realTodayIso;
    }

    /** Line 1 — standard retreat header: "JH Retreat 2026.7.20-26 - Day 2 Tue" */
    function volunteerRetreatHeaderLine() {
      const realToday = localTodayIso();
      const contextIso = volunteerHeaderContextIso(realToday);
      const span = retreatSpanCompact(VOLUNTEER_RETREAT.startDate, VOLUNTEER_RETREAT.endDate);
      const dayNum = dayNumberInRetreat(VOLUNTEER_RETREAT.startDate, contextIso);
      const weekday = weekdayShortLocal(contextIso);
      return `JH Retreat ${span} - Day ${dayNum} ${weekday}`;
    }

    function refreshVolunteerRetreatHeader() {
      if (!volRetreatHeader) return;
      if (volunteerTimeContext?.retreatBannerLine) {
        volRetreatHeader.textContent = volunteerTimeContext.retreatBannerLine;
        return;
      }
      volRetreatHeader.textContent = volunteerRetreatHeaderLine();
    }

    window.addEventListener('jh-volunteer-time-context', (ev) => {
      applyVolunteerTimeContext(ev.detail);
    });

    function volunteerAppContinueUrl() {
      if (VOLUNTEER_MAGIC_LINK_CONTINUE && VOLUNTEER_MAGIC_LINK_CONTINUE.startsWith('http')) {
        return VOLUNTEER_MAGIC_LINK_CONTINUE;
      }
      const paths = { dev: '/dev/', test: '/test/', retreat: '/retreat/' };
      const path = paths[volunteerEnv];
      if (path) {
        const origin = VOLUNTEER_API_ORIGINS[volunteerEnv] || window.location.origin;
        return `${origin}${path}`;
      }
      return magicLinkContinueUrl();
    }

    function magicLinkContinueUrl() {
      const params = new URLSearchParams(window.location.search);
      params.delete('invite');
      params.delete('apiKey');
      params.delete('oobCode');
      params.delete('mode');
      params.delete('lang');
      const qs = params.toString();
      return `${window.location.origin}${window.location.pathname}${qs ? `?${qs}` : ''}`;
    }

    function normalizeEmailLocal(raw) {
      const s = String(raw || '').trim().toLowerCase();
      return s && s.includes('@') ? s : '';
    }

    function isValidEmailFormat(raw) {
      const s = normalizeEmailLocal(raw);
      if (!s) return false;
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
    }

    function describeEmailError(raw) {
      const s = String(raw || '').trim();
      if (!s) return 'Enter your email address.';
      if (/\s/.test(s)) return 'Error: remove spaces from the email address, fix & retry.';
      if (!s.includes('@')) return 'Email must eventually include @ and .com or equivalent';
      const parts = s.split('@');
      if (parts.length !== 2 || !parts[0] || !parts[1]) {
        return 'Email must eventually include @ and .com or equivalent';
      }
      if (!parts[1].includes('.')) {
        return 'Email must eventually include @ and .com or equivalent';
      }
      if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.toLowerCase())) return '';
      return 'Error: email address format is invalid, fix & retry.';
    }

    /** @type {ReturnType<typeof setTimeout>|null} */
    let emailMethodsHintTimer = null;

    async function refreshEmailSignInHint() {
      if (signInMethod !== 'email') return;
      const email = normalizeEmailLocal(authEmailInput.value);
      if (!isValidEmailFormat(email)) return;
      try {
        const methods = await fetchSignInMethodsForEmail(auth, email);
        if (methods.includes('google.com') && !methods.includes('emailLink')) {
          setAuthMsg(
            'This address has signed in with Google before. For the smoothest sign-in, select By Google. You can still use email if you prefer.',
            false,
          );
        }
      } catch {
        /* fetchSignInMethodsForEmail may be blocked when enumeration protection is on */
      }
    }

    function scheduleEmailSignInHint() {
      if (emailMethodsHintTimer) clearTimeout(emailMethodsHintTimer);
      emailMethodsHintTimer = setTimeout(() => {
        emailMethodsHintTimer = null;
        refreshEmailSignInHint().catch(() => {});
      }, 350);
    }

    function setSignInMethod(method) {
      signInMethod = method === 'email' ? 'email' : 'google';
      if (btnMethodGoogle) {
        btnMethodGoogle.classList.toggle('jh-signin-method-selected', signInMethod === 'google');
        btnMethodGoogle.setAttribute('aria-checked', signInMethod === 'google' ? 'true' : 'false');
      }
      if (btnMethodEmail) {
        btnMethodEmail.classList.toggle('jh-signin-method-selected', signInMethod === 'email');
        btnMethodEmail.setAttribute('aria-checked', signInMethod === 'email' ? 'true' : 'false');
      }
      if (emailRow) emailRow.hidden = signInMethod !== 'email';
      refreshSignInUi();
    }

    function refreshSignInUi() {
      const canSignIn =
        signInMethod === 'google' || isValidEmailFormat(authEmailInput.value);
      if (btnSignIn) {
        btnSignIn.disabled = !canSignIn;
        btnSignIn.classList.toggle('jh-signin-btn-inactive', !canSignIn);
      }
    }

    function submitSignIn() {
      if (btnSignIn?.disabled) return;
      if (signInMethod === 'google') {
        startOAuthSignIn(new GoogleAuthProvider());
        return;
      }
      sendMagicLink();
    }

    function formatMagicLinkExpiryMinutes() {
      return `${MAGIC_LINK_TTL_MINUTES} minutes`;
    }

    function setEmailSentUi(email) {
      emailSentMsg.hidden = false;
      emailSentMsg.textContent = `Email sent. Click link in it\nCheck spam. Expires in ${formatMagicLinkExpiryMinutes()}`;
      authEmailInput.value = email;
      refreshSignInUi();
    }

    function clearEmailSentUi() {
      emailSentMsg.hidden = true;
      emailSentMsg.textContent = '';
    }

    function setAuthMsg(text, err) {
      authMsg.textContent = text || '';
      authMsg.className = 'msg' + (err ? ' err' : text ? ' ok' : '');
    }

    function setOnboardingMsg(text, isErr = false) {
      const el = document.getElementById('onboarding-msg');
      if (!el) return;
      el.textContent = text || '';
      el.className = 'msg' + (isErr ? ' err' : text ? ' ok' : '');
    }

    function clearLegacyKeycloakSession() {
      sessionStorage.removeItem('jh_keycloak_session');
      sessionStorage.removeItem('jh_kc_oauth_state');
    }

    function loadStoredInviteToken() {
      try {
        return sessionStorage.getItem(INVITE_STORAGE_KEY) || '';
      } catch {
        return '';
      }
    }

    function saveInviteToken(token) {
      const t = String(token || '').trim();
      if (!t) return;
      sessionStorage.setItem(INVITE_STORAGE_KEY, t);
    }

    function clearInviteToken() {
      sessionStorage.removeItem(INVITE_STORAGE_KEY);
    }

    function captureInviteFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const invite = params.get('invite');
      if (!invite) return null;
      saveInviteToken(invite);
      params.delete('invite');
      const qs = params.toString();
      const next = `${window.location.pathname}${qs ? `?${qs}` : ''}`;
      window.history.replaceState({}, document.title, next);
      return invite;
    }

    function setInviteBanner(text, isErr = false) {
      const el = document.getElementById('invite-banner');
      if (!el) return;
      if (!text) {
        el.hidden = true;
        el.textContent = '';
        el.classList.remove('err');
        return;
      }
      el.hidden = false;
      el.textContent = text;
      el.classList.toggle('err', isErr);
    }

    async function fetchInvitePreview(token) {
      const res = await fetch(`${API}/invites/${encodeURIComponent(token)}/preview`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || `Invite preview failed (${res.status})`);
      return data;
    }

    async function initInviteBanner() {
      captureInviteFromUrl();
      const token = loadStoredInviteToken();
      if (!token) return;
      try {
        invitePreview = await fetchInvitePreview(token);
        if (invitePreview.status === 'active') {
          const who = invitePreview.displayName || 'you';
          const retreat = invitePreview.retreatName ? ` (${invitePreview.retreatName})` : '';
          setInviteBanner(`Welcome, ${who}${retreat}. Sign in with Google or email.`);
        } else if (invitePreview.status === 'consumed') {
          clearInviteToken();
          setInviteBanner('You already used your invite. Sign in below with the same email as before.');
        } else if (invitePreview.status === 'expired') {
          clearInviteToken();
          setInviteBanner('This invite link has expired. Ask the organizer for a new QR code.', true);
        } else {
          setInviteBanner('Invite link is not valid. Ask the organizer for a new QR code.', true);
        }
      } catch (e) {
        setInviteBanner(String(e.message || e), true);
      }
    }

    async function apiVolunteerBootstrap(bearer) {
      const res = await fetch(`${API}/volunteer/bootstrap`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${bearer}`, 'Content-Type': 'application/json' },
        body: '{}',
      });
      const data = await res.json().catch(() => ({}));
      return { res, data };
    }

    function refreshOnboardContinueState() {
      const first = document.getElementById('ob-first')?.value.trim() || '';
      const last = document.getElementById('ob-last')?.value.trim() || '';
      const canContinue = first.length > 0 && last.length > 0;
      const btn = document.getElementById('btn-ob-save');
      if (!btn) return;
      btn.disabled = !canContinue;
      btn.classList.toggle('jh-signin-btn-inactive', !canContinue);
    }

    function fillOnboardingForm(draft) {
      document.getElementById('ob-first').value = draft.firstName || '';
      document.getElementById('ob-last').value = draft.lastName || '';
      const email = draft.authEmail || draft.email || normalizeEmailLocal(auth.currentUser?.email) || '';
      document.getElementById('ob-email-display').textContent = email;
      onboardingState = { authEmail: email, draft };
      refreshOnboardContinueState();
    }

    function applyOnboardingUi() {
      document.body.classList.add('jh-volunteer-auth');
      refreshVolunteerRetreatHeader();
      if (volScreenHeader) volScreenHeader.hidden = false;
      authPanel.hidden = true;
      onboardingPanel.hidden = false;
      volunteerSduiSection.hidden = true;
      setAuthMsg('');
      setOnboardingMsg('');
      refreshOnboardContinueState();
    }

    async function cancelOnboarding() {
      setOnboardingMsg('');
      onboardingState = null;
      try {
        await signOut(auth);
      } catch {
        /* ignore */
      }
      markVolunteerSignedOut();
      setSignInMethod('google');
      refreshVolunteerRetreatHeader();
    }

    async function showOnboardingFromBootstrap(data) {
      fillOnboardingForm(data);
      applyOnboardingUi();
    }

    async function getBearerToken(forceRefresh = false) {
      const user = auth.currentUser;
      if (!user) throw new Error('Not signed in');
      return user.getIdToken(forceRefresh);
    }

    async function completeVolunteerAccess() {
      const bearer = await getBearerToken(false);
      const { res, data } = await apiVolunteerBootstrap(bearer);
      if (!res.ok) throw new Error(data.error || `Bootstrap failed (${res.status})`);
      if (data.timeContext) applyVolunteerTimeContext(data.timeContext);
      if (data.profileConfirmed !== true) {
        await showOnboardingFromBootstrap(data);
        return { needsOnboarding: true };
      }
      return data;
    }

    function formatAuthError(e) {
      const code = e && e.code;
      if (code === 'auth/popup-closed-by-user') return '';
      if (code === 'auth/operation-not-allowed') {
        return 'Error: email link sign-in is not enabled in Firebase yet. Ask the organizers.';
      }
      if (code === 'auth/unauthorized-domain') {
        const h = typeof location !== 'undefined' ? location.hostname : 'this site';
        return `Error: ${h} is not an authorized domain in Firebase. Ask the organizers, fix & retry.`;
      }
      if (code === 'auth/unauthorized-continue-uri') {
        let host = 'this site';
        try {
          host = new URL(volunteerAppContinueUrl()).hostname;
        } catch {
          /* ignore */
        }
        return `Error: ${host} is not allowlisted in Firebase for email sign-in links. An organizer must add it under Firebase → Authentication → Settings → Authorized domains, fix & retry.`;
      }
      if (code === 'auth/invalid-email') {
        return 'Error: email address format is invalid, fix & retry.';
      }
      if (code === 'auth/too-many-requests') {
        return 'Error: too many sign-in attempts. Wait a few minutes, fix & retry.';
      }
      if (code === 'auth/invalid-action-code') {
        return 'Error: sign-in link expired or already used. Request a new link, fix & retry.';
      }
      if (code === 'auth/account-exists-with-different-credential') {
        return 'Error: this email is registered with a different sign-in method. Select By Google or use the same method as before, fix & retry.';
      }
      return e && e.message != null ? `Error: ${String(e.message)}, fix & retry` : String(e);
    }

    function friendlyApiError(e) {
      const m = e && e.message != null ? String(e.message) : String(e);
      const low = m.toLowerCase();
      if (e && e.status === 401) {
        return m + ' If this persists, sign out and sign in again.';
      }
      const looksNetwork =
        (e && e.name === 'TypeError') ||
        low.includes('failed to fetch') ||
        low.includes('load failed') ||
        low.includes('networkerror');
      if (looksNetwork) {
        return `Could not reach ${location.hostname} (network, DNS, VPN, or firewall). Detail: ${m}`;
      }
      return m;
    }

    function applySignedInUi() {
      document.body.classList.remove('jh-volunteer-auth');
      if (volScreenHeader) volScreenHeader.hidden = true;
      authPanel.hidden = true;
      onboardingPanel.hidden = true;
      volunteerSduiSection.hidden = false;
      setAuthMsg('');
      clearEmailSentUi();
      rememberDevAdminEmail();
      refreshDevToolsUi();
      sduiController.resetHome().catch(async (e) => {
        console.error('sdui home (auth)', e);
        const msg = String(e?.message || e);
        if (/complete volunteer onboarding|not bootstrapped|volunteer session not bootstrapped/i.test(msg)) {
          try {
            const bearer = await getBearerToken(false);
            const { res, data } = await apiVolunteerBootstrap(bearer);
            if (res.ok && data.profileConfirmed !== true) {
              if (data.timeContext) applyVolunteerTimeContext(data.timeContext);
              volunteerSduiSection.hidden = true;
              await showOnboardingFromBootstrap(data);
              return;
            }
          } catch (bootErr) {
            console.error('onboarding redirect', bootErr);
          }
        }
        sduiMsg.textContent = friendlyApiError(e);
        sduiMsg.className = 'msg err';
      });
    }

    async function enterVolunteerApp() {
      try {
        const access = await completeVolunteerAccess();
        if (access?.needsOnboarding) return;
        sessionStorage.removeItem(VOLUNTEER_SIGNOUT_KEY);
        applySignedInUi();
      } catch (e) {
        console.error('volunteer access', e);
        const msg = String(e.message || e);
        setAuthMsg(msg, true);
        if (/complete volunteer onboarding|profile not confirmed|needs onboarding/i.test(msg)) {
          return;
        }
        try {
          await signOut(auth);
        } catch {
          /* ignore */
        }
        markVolunteerSignedOut();
      }
    }

    function applySignedOutUi() {
      document.body.classList.add('jh-volunteer-auth');
      refreshVolunteerRetreatHeader();
      if (volScreenHeader) volScreenHeader.hidden = false;
      authPanel.hidden = false;
      onboardingPanel.hidden = true;
      volunteerSduiSection.hidden = true;
      onboardingState = null;
      refreshDevToolsUi();
    }

    function rememberDevAdminEmail() {
      if (BUILD_ENV !== 'dev') return;
      const em = normalizeEmailLocal(auth.currentUser?.email);
      if (!em) return;
      try {
        localStorage.setItem(DEV_ADMIN_HINT_KEY, em);
      } catch {
        /* ignore */
      }
      refreshDevToolsUi();
    }

    function devAdminHintEmail() {
      try {
        return localStorage.getItem(DEV_ADMIN_HINT_KEY) || '';
      } catch {
        return '';
      }
    }

    function refreshDevToolsUi() {
      if (BUILD_ENV !== 'dev' || !devToolsEl) return;
      devToolsEl.hidden = false;
      const hint = devAdminHintEmail();
      const signedOut = Boolean(sessionStorage.getItem(VOLUNTEER_SIGNOUT_KEY)) || !auth.currentUser;
      if (btnDevRestoreAdmin) btnDevRestoreAdmin.hidden = !(signedOut && hint);
      if (devToolsHint) {
        if (signedOut && hint) {
          devToolsHint.hidden = false;
          devToolsHint.textContent = `Manage/Admin return when you sign in as ${hint} (same Google account as before).`;
        } else {
          devToolsHint.hidden = true;
          devToolsHint.textContent = '';
        }
      }
    }

    function clearVolunteerClientState() {
      clearInviteToken();
      localStorage.removeItem(EMAIL_LINK_STORAGE_KEY);
      clearLegacyKeycloakSession();
      onboardingState = null;
      clearEmailSentUi();
      if (authEmailInput) authEmailInput.value = '';
      setSignInMethod('google');
    }

    async function devTestAsNewUser() {
      rememberDevAdminEmail();
      clearVolunteerClientState();
      try {
        await signOut(auth);
      } catch {
        /* ignore */
      }
      markVolunteerSignedOut();
      const hint = devAdminHintEmail();
      setAuthMsg(
        hint
          ? `Signed out for login/onboarding testing. Sign in with ${hint} (Google or email) to restore Manage and Admin. Use a different address to test a brand-new volunteer.`
          : 'Signed out for testing. Sign in with your usual admin Google account to restore Manage and Admin.',
        false,
      );
      refreshDevToolsUi();
    }

    function markVolunteerSignedOut() {
      sessionStorage.setItem(VOLUNTEER_SIGNOUT_KEY, '1');
      clearLegacyKeycloakSession();
      applySignedOutUi();
    }

    async function startOAuthSignIn(provider) {
      setAuthMsg('');
      clearEmailSentUi();
      sessionStorage.removeItem(VOLUNTEER_SIGNOUT_KEY);
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        const msg = formatAuthError(e);
        if (msg) setAuthMsg(msg, true);
      }
    }

    async function sendMagicLink() {
      setAuthMsg('');
      clearEmailSentUi();
      const email = normalizeEmailLocal(authEmailInput.value);
      const fmtErr = describeEmailError(email);
      if (fmtErr) {
        setAuthMsg(fmtErr, true);
        return;
      }
      btnSignIn.disabled = true;
      try {
        await sendSignInLinkToEmail(auth, email, {
          url: volunteerAppContinueUrl(),
          handleCodeInApp: true,
        });
        window.localStorage.setItem(EMAIL_LINK_STORAGE_KEY, email);
        sessionStorage.removeItem(VOLUNTEER_SIGNOUT_KEY);
        setEmailSentUi(email);
        setAuthMsg('');
      } catch (e) {
        setAuthMsg(formatAuthError(e), true);
      } finally {
        refreshSignInUi();
      }
    }

    async function completeMagicLinkIfPresent() {
      if (!isSignInWithEmailLink(auth, window.location.href)) return false;
      magicLinkHandling = true;
      setAuthMsg('Completing sign-in from email link…', false);
      let email = window.localStorage.getItem(EMAIL_LINK_STORAGE_KEY) || normalizeEmailLocal(authEmailInput.value);
      if (!email) {
        email = normalizeEmailLocal(window.prompt('Enter the email address you used for the sign-in link') || '');
      }
      if (!email) {
        setAuthMsg('Error: enter the same email address you used for the link, fix & retry.', true);
        magicLinkHandling = false;
        return false;
      }
      try {
        await signInWithEmailLink(auth, email, window.location.href);
        window.localStorage.removeItem(EMAIL_LINK_STORAGE_KEY);
        window.history.replaceState({}, document.title, volunteerAppContinueUrl());
        clearEmailSentUi();
        setAuthMsg('');
        sessionStorage.removeItem(VOLUNTEER_SIGNOUT_KEY);
        await enterVolunteerApp();
        return true;
      } catch (e) {
        setAuthMsg(formatAuthError(e), true);
        return false;
      } finally {
        magicLinkHandling = false;
      }
    }

    document.getElementById('sdui-back').addEventListener('click', () => {
      sduiController.goBack().catch((e) => console.error('sdui back', e));
    });

    if (btnMethodGoogle) {
      btnMethodGoogle.addEventListener('click', () => {
        setSignInMethod('google');
        setAuthMsg('');
      });
    }

    if (btnMethodEmail) {
      btnMethodEmail.addEventListener('click', () => {
        setSignInMethod('email');
        if (authEmailInput) authEmailInput.focus();
        scheduleEmailSignInHint();
      });
    }

    if (btnSignIn) {
      btnSignIn.addEventListener('click', () => {
        submitSignIn();
      });
    }

    if (btnDevTestNewUser) {
      btnDevTestNewUser.addEventListener('click', () => {
        devTestAsNewUser().catch((e) => console.error('dev test new user', e));
      });
    }

    if (btnDevRestoreAdmin) {
      btnDevRestoreAdmin.addEventListener('click', () => {
        const hint = devAdminHintEmail();
        if (hint && authEmailInput) authEmailInput.value = hint;
        setSignInMethod('google');
        startOAuthSignIn(new GoogleAuthProvider());
      });
    }

    authEmailInput.addEventListener('input', () => {
      clearEmailSentUi();
      refreshSignInUi();
      if (signInMethod !== 'email') return;
      const raw = authEmailInput.value;
      if (!raw.trim()) {
        setAuthMsg('');
        return;
      }
      const err = describeEmailError(raw);
      if (err) {
        setAuthMsg(err, err.startsWith('Error:'));
        return;
      }
      setAuthMsg('');
      scheduleEmailSignInHint();
    });

    authEmailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && signInMethod === 'email' && !btnSignIn?.disabled) {
        e.preventDefault();
        submitSignIn();
      }
    });

    document.getElementById('btn-out').addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch {
        /* ignore */
      }
      markVolunteerSignedOut();
    });

    document.getElementById('btn-ob-save').addEventListener('click', async () => {
      if (document.getElementById('btn-ob-save')?.disabled) return;
      setOnboardingMsg('');
      const firstName = document.getElementById('ob-first').value.trim();
      const lastName = document.getElementById('ob-last').value.trim();
      const email =
        onboardingState?.authEmail ||
        onboardingState?.draft?.authEmail ||
        onboardingState?.draft?.email ||
        normalizeEmailLocal(auth.currentUser?.email) ||
        '';

      if (!firstName) {
        setOnboardingMsg('Enter your first name.', true);
        return;
      }
      if (!lastName) {
        setOnboardingMsg('Enter your last name.', true);
        return;
      }
      if (firstName.length > 15 || lastName.length > 15) {
        setOnboardingMsg('First and last name must each be 15 characters or fewer.', true);
        return;
      }
      if (!email) {
        setOnboardingMsg('Sign-in email is missing. Sign out and sign in again.', true);
        return;
      }

      try {
        const bearer = await getBearerToken(false);
        const res = await fetch(`${API}/volunteer/onboarding/complete`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${bearer}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName, lastName, email, phone: '' }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        onboardingPanel.hidden = true;
        onboardingState = null;
        sessionStorage.removeItem(VOLUNTEER_SIGNOUT_KEY);
        applySignedInUi();
      } catch (e) {
        setOnboardingMsg(String(e.message || e), true);
      }
    });

    document.getElementById('btn-ob-cancel').addEventListener('click', () => {
      cancelOnboarding().catch((e) => console.error('onboarding cancel', e));
    });

    for (const id of ['ob-first', 'ob-last']) {
      document.getElementById(id)?.addEventListener('input', () => {
        refreshOnboardContinueState();
      });
      document.getElementById(id)?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') e.preventDefault();
      });
    }

    async function initAuth() {
      clearLegacyKeycloakSession();
      await fetchVolunteerTimeContext();
      refreshVolunteerRetreatHeader();
      await initInviteBanner();
      setSignInMethod('google');
      const storedEmail = window.localStorage.getItem(EMAIL_LINK_STORAGE_KEY);
      if (storedEmail && isValidEmailFormat(storedEmail)) {
        authEmailInput.value = storedEmail;
        setSignInMethod('email');
      }
      const magicLinkCompleted = await completeMagicLinkIfPresent();
      authFlowReady = true;
      rememberDevAdminEmail();
      refreshDevToolsUi();
      if (!magicLinkCompleted && auth.currentUser && !sessionStorage.getItem(VOLUNTEER_SIGNOUT_KEY)) {
        await enterVolunteerApp();
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!authFlowReady || magicLinkHandling) return;
      if (user) {
        rememberDevAdminEmail();
        refreshDevToolsUi();
        await enterVolunteerApp();
      } else if (!sessionStorage.getItem(VOLUNTEER_SIGNOUT_KEY)) {
        applySignedOutUi();
      }
    });

    initAuth();
  </script>
</body>
</html>
