    <path d="M 200 342 C 218 308 248 312 256 338 C 248 352 212 348 200 342"/>
    <path d="M 312 342 C 294 308 264 312 256 338 C 264 352 300 348 312 342"/>
    <path d="M 188 358 C 210 330 236 338 228 362 C 214 368 196 368 188 358"/>
    <path d="M 324 358 C 302 330 276 338 284 362 C 298 368 316 368 324 358"/>
    <path d="M 256 358 C 232 368 232 396 256 404 C 280 396 280 368 256 358 Z"/>
    <ellipse cx="256" cy="398" rx="118" ry="26" fill="#ececec"/>
  </g>

  <!-- Jewel rim + Gakyil (clipped, non-overlapping wedges) -->
  <circle cx="256" cy="260" r="90" fill="#f2f2f2" stroke="#2b2b2b" stroke-width="2"/>

  <g clip-path="url(#jewelClip)">
    <!-- Wedges: 120� each, center (256,260), r=88; angles 0� = east, 90� = south (SVG y-down) -->
    <!-- Yellow: 210� � 330� through top (270�) -->
    <path fill="#fbc02d" d="
      M 256 260
      L 179.79 216
      A 88 88 0 0 1 332.21 216
      Z"/>
    <!-- Red: 90� � 210� through left (180�) -->
    <path fill="#d32f2f" d="
      M 256 260
      L 256 348
      A 88 88 0 0 1 179.79 216
      Z"/>
    <!-- Blue: 330� � 90� through east (0�) -->
    <path fill="#1976d2" d="
      M 256 260
      L 332.21 216
      A 88 88 0 0 1 256 348
      Z"/>
    <!-- Soft green blend at lower triple junction -->
    <circle cx="256" cy="288" r="22" fill="#43a047" fill-opacity="0.22"/>
    <!-- Gloss highlight -->
    <ellipse cx="256" cy="218" rx="38" ry="28" fill="#ffffff" fill-opacity="0.35"/>
  </g>
