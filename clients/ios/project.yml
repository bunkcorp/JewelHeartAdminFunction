# Generate: cd clients/ios && xcodegen generate
# Open: open JewelHeartAdmin.xcodeproj
name: JewelHeartAdmin
options:
  bundleIdPrefix: org.jewelheart
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.7.0
targets:
  JewelHeartAdmin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: GoogleService-Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.jewelheart.admin
        PRODUCT_NAME: JewelHeartAdmin
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JewelHeart Admin
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore

schemes:
  JewelHeartAdmin:
    build:
      targets:
        JewelHeartAdmin: all
