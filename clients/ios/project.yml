# Generate: cd clients/ios && xcodegen generate
# Open: open JewelHeartAdmin.xcodeproj
name: JewelHeartAdmin
options:
  bundleIdPrefix: org.jewelheart
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.7.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  JewelHeartAdmin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: GoogleService-Info.plist
        buildPhase: resources
    info:
      path: Supporting/GoogleURLScheme.plist
    settings:
      base:
        # Same Apple team as KarmaDots (Xcode → Signing if you need a different team)
        DEVELOPMENT_TEAM: 7YLNYUAHS3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: org.jewelheart.admin
        PRODUCT_NAME: JewelHeartAdmin
        TARGETED_DEVICE_FAMILY: "1,2"
        # Prefer real iPhone in the destination list over “My Mac (Designed for iPhone)”.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/JewelHeartAdmin-Bridging-Header.h
        INFOPLIST_KEY_CFBundleDisplayName: JewelHeart Admin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationDelegateClassName: $(PRODUCT_MODULE_NAME).JewelHeartAppDelegate
        INFOPLIST_KEY_UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).JewelHeartSceneDelegate
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: JewelHeartAdmin.entitlements
        # Matches GettingStoned Firebase iOS app (same project as KarmaDots / api.karmadots.org).
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.120549448949-lncqvpqrf30hrk72jrnictbjn6srsjne
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn

schemes:
  JewelHeartAdmin:
    build:
      targets:
        JewelHeartAdmin: all
