  <script type="module">
    import { createVolunteerSduiController, JH_LOGIN_WEB_BUILD } from './jewelheart-sdui.js?v=2026-07-01-11:01';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      signInWithPhoneNumber,
      RecaptchaVerifier,
      signOut,
      onAuthStateChanged,
    } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyAd7WirDcLLX9bl1BY4uAhjiXEvpB-HiFw',
      authDomain: 'gettingstoned-4aee3.firebaseapp.com',
      projectId: 'gettingstoned-4aee3',
      storageBucket: 'gettingstoned-4aee3.firebasestorage.app',
      messagingSenderId: '120549448949',
      appId: '1:120549448949:ios:189513e804833eed5db9bc',
    };

    const API = 'https://api-test.karmadots.org/jewelheart';

    const KEYCLOAK_ISSUER = 'https://auth.karmadots.org/realms/karmadots';
    const KEYCLOAK_CLIENT_ID = 'karmadots-web';
    const KEYCLOAK_SESSION_KEY = 'jh_keycloak_session';
    const KEYCLOAK_STATE_KEY = 'jh_kc_oauth_state';
    const INVITE_STORAGE_KEY = 'jh_volunteer_invite_token';

    /** @type {'firebase' | 'keycloak' | null} */
    let authSource = null;
    /** @type {{ displayName?: string, retreatName?: string } | null} */
    let invitePreview = null;

    /** @type {import('firebase/auth').ConfirmationResult | null} */
    let phoneConfirmation = null;
    /** @type {import('firebase/auth').RecaptchaVerifier | null} */
    let phoneRecaptcha = null;
    let phoneSendInFlight = false;
    let phoneLastSentE164 = '';
    let phoneLastSentAt = 0;

    function loadStoredInviteToken() {
      try {
        return sessionStorage.getItem(INVITE_STORAGE_KEY) || '';
      } catch {
        return '';
      }
    }

    function saveInviteToken(token) {
      const t = String(token || '').trim();
      if (!t) return;
      sessionStorage.setItem(INVITE_STORAGE_KEY, t);
    }

    function clearInviteToken() {
      sessionStorage.removeItem(INVITE_STORAGE_KEY);
    }

    function captureInviteFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const invite = params.get('invite');
      if (!invite) return null;
      saveInviteToken(invite);
      params.delete('invite');
      const qs = params.toString();
      const next = `${window.location.pathname}${qs ? `?${qs}` : ''}`;
      window.history.replaceState({}, document.title, next);
      return invite;
    }

    function setInviteBanner(text, isErr = false) {
      const el = document.getElementById('invite-banner');
      if (!el) return;
      if (!text) {
        el.hidden = true;
        el.textContent = '';
        el.classList.remove('err');
        return;
      }
      el.hidden = false;
      el.textContent = text;
      el.classList.toggle('err', isErr);
    }

    async function fetchInvitePreview(token) {
      const res = await fetch(`${API}/invites/${encodeURIComponent(token)}/preview`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || `Invite preview failed (${res.status})`);
      return data;
    }

    function rosterPhoneForInput(raw) {
      const e164 = normalizePhoneE164(raw);
      if (!e164) return '';
      const digits = e164.replace(/\D/g, '');
      if (digits.length === 11 && digits.startsWith('1')) return digits.slice(1);
      if (digits.length === 10) return digits;
      return String(raw || '').trim();
    }

    function applyInviteFormPrefill() {
      if (!invitePreview?.phone) return;
      const phoneEl = document.getElementById('phone');
      if (phoneEl && !phoneEl.value.trim()) {
        phoneEl.value = rosterPhoneForInput(invitePreview.phone);
      }
    }

    async function initInviteBanner() {
      captureInviteFromUrl();
      const token = loadStoredInviteToken();
      if (!token) return;
      try {
        invitePreview = await fetchInvitePreview(token);
        applyInviteFormPrefill();
        if (invitePreview.status === 'active') {
          const who = invitePreview.displayName || 'you';
          const retreat = invitePreview.retreatName ? ` (${invitePreview.retreatName})` : '';
          setInviteBanner(
            `Welcome, ${who}${retreat}. Sign in with the email or phone the organizers have for you.`,
          );
        } else if (invitePreview.status === 'consumed') {
          clearInviteToken();
          setInviteBanner('You already used your invite. Sign in below with the same email or phone as on the roster.', false);
        } else if (invitePreview.status === 'expired') {
          clearInviteToken();
          setInviteBanner('This invite link has expired. Ask the organizer for a new QR code.', true);
        } else {
          setInviteBanner('Invite link is not valid. Ask the organizer for a new QR code.', true);
        }
      } catch (e) {
        setInviteBanner(String(e.message || e), true);
      }
    }

    async function apiVolunteerSession(bearer) {
      const res = await fetch(`${API}/volunteer/session`, {
        headers: { Authorization: `Bearer ${bearer}` },
      });
      const data = await res.json().catch(() => ({}));
      return { res, data };
    }

    async function apiRedeemInvite(bearer, inviteToken) {
      const res = await fetch(`${API}/invites/redeem`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${bearer}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ inviteToken }),
      });
      const data = await res.json().catch(() => ({}));
      return { res, data };
    }

    async function completeVolunteerAccess() {
      const bearer = await getBearerToken(false);
      const inviteToken = loadStoredInviteToken();
      if (inviteToken) {
        const { res, data } = await apiRedeemInvite(bearer, inviteToken);
        if (res.ok) {
          clearInviteToken();
          setInviteBanner('');
          return data;
        }
        const retryCodes = new Set(['consumed', 'expired', 'not_found']);
        if (retryCodes.has(data.error)) {
          clearInviteToken();
          setInviteBanner('');
        } else {
          const msg = data.message || data.error || `Invite link failed (${res.status})`;
          throw Object.assign(new Error(msg), { status: res.status, code: data.error });
        }
      }
      const { res, data } = await apiVolunteerSession(bearer);
      if (!res.ok) throw new Error(data.error || `Session check failed (${res.status})`);
      if (data.linked || data.isAdmin) return data;
      throw Object.assign(
        new Error('Scan your personal QR code from the organizer to link this account to the retreat roster.'),
        { code: 'needs_invite' },
      );
    }

    function keycloakRedirectUri() {
      return new URL('/testerslogin/', window.location.origin).href;
    }

    function loadKeycloakSession() {
      try {
        const raw = sessionStorage.getItem(KEYCLOAK_SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function saveKeycloakSession({ accessToken, refreshToken, sub, email, idToken, phone }) {
      const expMs = decodeJwtExpMs(accessToken);
      sessionStorage.setItem(
        KEYCLOAK_SESSION_KEY,
        JSON.stringify({ accessToken, refreshToken, sub, email: email || null, phone: phone || null, idToken: idToken || null, expMs }),
      );
    }

    function clearKeycloakSession() {
      sessionStorage.removeItem(KEYCLOAK_SESSION_KEY);
      sessionStorage.removeItem(KEYCLOAK_STATE_KEY);
    }

    function base64UrlDecode(s) {
      const padded = s + '=='.slice((s.length + 3) % 4);
      return atob(padded.replace(/-/g, '+').replace(/_/g, '/'));
    }

    function decodeJwtPayload(token) {
      const parts = String(token).split('.');
      if (parts.length < 2) return null;
      try {
        return JSON.parse(base64UrlDecode(parts[1]));
      } catch {
        return null;
      }
    }

    function decodeJwtExpMs(token) {
      const p = decodeJwtPayload(token);
      return p && p.exp ? p.exp * 1000 : null;
    }

    function keycloakIssuerBase() {
      return KEYCLOAK_ISSUER.replace(/\/$/, '');
    }

    function keycloakAuthorizationEndpoint() {
      return `${keycloakIssuerBase()}/protocol/openid-connect/auth`;
    }

    function keycloakLogoutEndpoint() {
      return `${keycloakIssuerBase()}/protocol/openid-connect/logout`;
    }

    function keycloakTokenEndpoint() {
      return `${keycloakIssuerBase()}/protocol/openid-connect/token`;
    }

    function normalizePhoneE164(raw) {
      const digits = String(raw || '').replace(/\D/g, '');
      if (!digits) return null;
      if (String(raw).trim().startsWith('+')) return `+${digits}`;
      if (digits.length === 10) return `+1${digits}`;
      if (digits.length === 11 && digits.startsWith('1')) return `+${digits}`;
      return `+${digits}`;
    }

    async function resetPhoneRecaptcha() {
      if (phoneRecaptcha) {
        try {
          phoneRecaptcha.clear();
        } catch {
          /* ignore */
        }
        phoneRecaptcha = null;
      }
      const container = document.getElementById('recaptcha-phone');
      if (container) container.replaceChildren();
    }

    async function getPhoneRecaptcha() {
      await resetPhoneRecaptcha();
      phoneRecaptcha = new RecaptchaVerifier(auth, 'recaptcha-phone', { size: 'invisible' });
      await phoneRecaptcha.render();
      return phoneRecaptcha;
    }

    function setPhoneSendUi(sending) {
      const btn = document.getElementById('btn-phone-send');
      if (!btn) return;
      btn.disabled = sending;
      btn.textContent = sending ? 'Sending…' : 'Send code';
    }

    function formatPhoneUserMessage(e) {
      const code = e && e.code;
      const m = e && e.message != null ? String(e.message) : String(e);
      const low = m.toLowerCase();
      if (code === 'PHONE_NEED_RESEND' || m === 'PHONE_NEED_RESEND') {
        return 'Tap Send code again, wait for the text message, then enter the code and tap Phone sign-in.';
      }
      if (low.includes('recaptcha') && (low.includes('already') || low.includes('render'))) {
        return 'Tap Send code once and wait a few seconds. If no text arrives, wait one minute and try again.';
      }
      if (code === 'auth/invalid-verification-code') {
        return 'That code is not correct. Check the text message and try again, or tap Send code for a new one.';
      }
      if (code === 'auth/code-expired') {
        return 'That code expired. Tap Send code to get a fresh one.';
      }
      if (code === 'auth/too-many-requests') {
        return 'Too many tries. Wait a few minutes, then tap Send code again.';
      }
      if (code === 'auth/invalid-phone-number') {
        return 'That phone number does not look valid. Use 10 digits (US) or include + and country code.';
      }
      return formatAuthError(e);
    }

    async function sendFirebasePhoneCode(phoneE164) {
      if (phoneSendInFlight) {
        setAuthMsg('Still sending the code… wait a moment.', false);
        return;
      }

      const now = Date.now();
      if (phoneConfirmation && phoneLastSentE164 === phoneE164 && now - phoneLastSentAt < 90_000) {
        setAuthMsg(
          `We already sent a code to ${phoneE164}. Enter it below when it arrives. (Wait about a minute before requesting another.)`,
          false,
        );
        return;
      }

      phoneSendInFlight = true;
      setPhoneSendUi(true);
      setAuthMsg('Sending code…', false);
      clearKeycloakSession();
      authSource = null;

      try {
        try {
          await signOut(auth);
        } catch {
          /* ignore */
        }
        phoneConfirmation = null;
        const verifier = await getPhoneRecaptcha();
        phoneConfirmation = await signInWithPhoneNumber(auth, phoneE164, verifier);
        phoneLastSentE164 = phoneE164;
        phoneLastSentAt = Date.now();
        setAuthMsg(
          `Code sent to ${phoneE164}. Enter it in the box below, then tap Phone sign-in.`,
          false,
        );
      } catch (e) {
        phoneConfirmation = null;
        phoneLastSentE164 = '';
        phoneLastSentAt = 0;
        await resetPhoneRecaptcha();
        setAuthMsg(formatPhoneUserMessage(e), true);
      } finally {
        phoneSendInFlight = false;
        setPhoneSendUi(false);
      }
    }

    async function completeFirebasePhoneSignIn(code) {
      if (!phoneConfirmation) {
        const err = new Error('PHONE_NEED_RESEND');
        err.code = 'PHONE_NEED_RESEND';
        throw err;
      }
      await phoneConfirmation.confirm(String(code || '').trim());
      phoneConfirmation = null;
      phoneLastSentE164 = '';
      phoneLastSentAt = 0;
      await resetPhoneRecaptcha();
    }

    async function exchangeKeycloakCode(code) {
      const body = new URLSearchParams({
        grant_type: 'authorization_code',
        client_id: KEYCLOAK_CLIENT_ID,
        redirect_uri: keycloakRedirectUri(),
        code,
      });
      const res = await fetch(keycloakTokenEndpoint(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      });
      const text = await res.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch {
        json = null;
      }
      if (!res.ok) {
        throw new Error(json?.error_description || json?.error || text || `Token exchange HTTP ${res.status}`);
      }
      const accessToken = json.access_token;
      const refreshToken = json.refresh_token;
      if (!accessToken || !refreshToken) throw new Error('Keycloak did not return tokens');
      const payload = decodeJwtPayload(accessToken);
      const sub = payload?.sub;
      if (!sub) throw new Error('Keycloak token missing subject');
      return { accessToken, refreshToken, sub, email: payload?.email || null, idToken: json.id_token || null };
    }

    async function refreshKeycloakAccessToken() {
      const session = loadKeycloakSession();
      if (!session?.refreshToken) throw new Error('Not signed in');
      const body = new URLSearchParams({
        grant_type: 'refresh_token',
        client_id: KEYCLOAK_CLIENT_ID,
        refresh_token: session.refreshToken,
      });
      const res = await fetch(keycloakTokenEndpoint(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      });
      const text = await res.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch {
        json = null;
      }
      if (!res.ok) {
        clearKeycloakSession();
        throw new Error(json?.error_description || json?.error || `Refresh HTTP ${res.status}`);
      }
      const accessToken = json.access_token;
      const refreshToken = json.refresh_token || session.refreshToken;
      if (!accessToken) throw new Error('Refresh did not return access_token');
      const payload = decodeJwtPayload(accessToken);
      saveKeycloakSession({
        accessToken,
        refreshToken,
        sub: payload?.sub || session.sub,
        email: payload?.email || session.email,
        phone: session.phone || null,
        idToken: session.idToken || null,
      });
      return accessToken;
    }

    async function getKeycloakAccessToken(forceRefresh = false) {
      const session = loadKeycloakSession();
      if (!session?.accessToken) throw new Error('Not signed in');
      if (!forceRefresh && session.expMs && session.expMs > Date.now() + 60_000) {
        return session.accessToken;
      }
      return refreshKeycloakAccessToken();
    }

    async function getBearerToken(forceRefresh = false) {
      if (authSource === 'keycloak') return getKeycloakAccessToken(forceRefresh);
      const user = auth.currentUser;
      if (!user) throw new Error('Not signed in');
      return user.getIdToken(forceRefresh);
    }

    async function startKeycloakLogin() {
      setAuthMsg('');
      clearKeycloakSession();
      authSource = null;
      try {
        await signOut(auth);
      } catch {
        /* ignore */
      }
      const state = crypto.randomUUID();
      sessionStorage.setItem(KEYCLOAK_STATE_KEY, state);
      const url = new URL(keycloakAuthorizationEndpoint());
      url.searchParams.set('response_type', 'code');
      url.searchParams.set('client_id', KEYCLOAK_CLIENT_ID);
      url.searchParams.set('redirect_uri', keycloakRedirectUri());
      url.searchParams.set('scope', 'openid email profile');
      url.searchParams.set('state', state);
      url.searchParams.set('prompt', 'login');
      window.location.assign(url.toString());
    }

    function signOutKeycloak() {
      const session = loadKeycloakSession();
      authSource = null;
      applySignedOutUi();
      const url = new URL(keycloakLogoutEndpoint());
      url.searchParams.set('client_id', KEYCLOAK_CLIENT_ID);
      url.searchParams.set('post_logout_redirect_uri', keycloakRedirectUri());
      if (session?.idToken) url.searchParams.set('id_token_hint', session.idToken);
      clearKeycloakSession();
      window.location.assign(url.toString());
    }

    async function maybeCompleteKeycloakCallback() {
      const params = new URLSearchParams(window.location.search);
      const err = params.get('error');
      if (err) throw new Error(params.get('error_description') || err);
      const code = params.get('code');
      if (!code) return false;
      const state = params.get('state');
      const saved = sessionStorage.getItem(KEYCLOAK_STATE_KEY);
      sessionStorage.removeItem(KEYCLOAK_STATE_KEY);
      if (!saved || state !== saved) throw new Error('Invalid Keycloak sign-in state (try again)');
      const tokens = await exchangeKeycloakCode(code);
      saveKeycloakSession(tokens);
      window.history.replaceState({}, document.title, keycloakRedirectUri());
      return true;
    }

    function formatKeycloakError(e) {
      const m = e && e.message != null ? String(e.message) : String(e);
      if (/load failed|failed to fetch|networkerror/i.test(m)) {
        return (
          'Could not reach auth.karmadots.org from this browser (network, VPN, or privacy extension). ' +
          'Try again on cellular/Wi‑Fi or allow auth.karmadots.org.'
        );
      }
      if (/invalid_redirect_uri/i.test(m)) {
        return (
          m +
          ' Add redirect URI ' +
          keycloakRedirectUri() +
          ' to Keycloak client "' +
          KEYCLOAK_CLIENT_ID +
          '" (realm karmadots).'
        );
      }
      return m;
    }

    function setAuthMsg(text, err) {
      authMsg.textContent = text || '';
      authMsg.className = 'msg' + (err ? ' err' : '');
    }

    function friendlyApiError(e) {
      const m = e && e.message != null ? String(e.message) : String(e);
      const low = m.toLowerCase();
      if (e && e.status === 401) {
        return m + ' If this persists, sign out and sign in again (refreshes your ID token).';
      }
      const looksNetwork =
        (e && e.name === 'TypeError') ||
        low.includes('failed to fetch') ||
        low.includes('load failed') ||
        low.includes('networkerror');
      if (looksNetwork) {
        return (
          'Could not reach api-test.karmadots.org (network, DNS, VPN, firewall, or browser extension). Detail: ' + m
        );
      }
      return m;
    }

    function formatAuthError(e) {
      const code = e && e.code;
      if (code === 'auth/unauthorized-domain') {
        const h = typeof location !== 'undefined' ? location.hostname : 'this site';
        return (
          'auth/unauthorized-domain: Firebase Console → Authentication → Authorized domains → add "' +
          h +
          '". Then reload.'
        );
      }
      return e && e.message != null ? String(e.message) : String(e);
    }

    function applySignedInUi() {
      authPanel.hidden = true;
      volunteerSduiSection.hidden = false;
      setAuthMsg('');
      sduiController.resetHome().catch((e) => {
        console.error('sdui home (auth)', e);
        sduiMsg.textContent = friendlyApiError(e);
        sduiMsg.className = 'msg err';
      });
    }

    async function enterVolunteerApp() {
      try {
        await completeVolunteerAccess();
        applySignedInUi();
      } catch (e) {
        console.error('volunteer access', e);
        setAuthMsg(String(e.message || e), true);
        if (authSource === 'keycloak') {
          clearKeycloakSession();
          authSource = null;
        } else {
          try {
            await signOut(auth);
          } catch {
            /* ignore */
          }
          authSource = null;
        }
        applySignedOutUi();
      }
    }

    function applySignedOutUi() {
      authPanel.hidden = false;
      volunteerSduiSection.hidden = true;
    }

    async function initAuth() {
      await initInviteBanner();
      try {
        if (await maybeCompleteKeycloakCallback()) {
          authSource = 'keycloak';
          await enterVolunteerApp();
          return;
        }
      } catch (e) {
        setAuthMsg(formatKeycloakError(e), true);
        window.history.replaceState({}, document.title, keycloakRedirectUri());
      }
      const session = loadKeycloakSession();
      if (session?.accessToken) {
        try {
          await getKeycloakAccessToken(false);
          authSource = 'keycloak';
          await enterVolunteerApp();
        } catch {
          clearKeycloakSession();
        }
      }
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authPanel = document.getElementById('auth-panel');
    const volunteerSduiSection = document.getElementById('volunteer-sdui-section');
    const authMsg = document.getElementById('auth-msg');
    const sduiMsg = document.getElementById('sdui-msg');

    const sduiController = createVolunteerSduiController({
      apiBase: API,
      getIdToken: () => getBearerToken(),
      rootEl: document.getElementById('sdui-root'),
      titleEl: document.getElementById('sdui-title'),
      msgEl: sduiMsg,
      backBtn: document.getElementById('sdui-back'),
      buildStampEl: document.getElementById('sdui-build-stamp'),
      uiChannel: 'testers',
    });
    {
      const bs0 = document.getElementById('sdui-build-stamp');
      if (bs0) bs0.textContent = `web ${JH_LOGIN_WEB_BUILD} · api …`;
    }

    document.getElementById('sdui-back').addEventListener('click', () => {
      sduiController.goBack().catch((e) => console.error('sdui back', e));
    });

    document.getElementById('btn-google').addEventListener('click', async () => {
      setAuthMsg('');
      clearKeycloakSession();
      authSource = null;
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (e) {
        setAuthMsg(formatAuthError(e), true);
      }
    });

    document.getElementById('btn-keycloak').addEventListener('click', async () => {
      try {
        await startKeycloakLogin();
      } catch (e) {
        setAuthMsg(formatKeycloakError(e), true);
      }
    });

    document.getElementById('btn-phone-send').addEventListener('click', async () => {
      const phoneE164 = normalizePhoneE164(document.getElementById('phone').value.trim());
      if (!phoneE164) {
        setAuthMsg('Enter a valid phone number (10 digits, or + and country code).', true);
        return;
      }
      await sendFirebasePhoneCode(phoneE164);
    });

    document.getElementById('btn-phone-signin').addEventListener('click', async () => {
      const phoneE164 = normalizePhoneE164(document.getElementById('phone').value.trim());
      const code = document.getElementById('phone-code').value.trim();
      if (!phoneE164) {
        setAuthMsg('Enter your phone number first.', true);
        return;
      }
      if (!code) {
        setAuthMsg('Enter the code from your text message.', true);
        return;
      }
      if (!phoneConfirmation) {
        setAuthMsg(
          'Stay on this tab: tap Send code, wait for the text, enter the code, then tap Phone sign-in. Switching apps can reset the step.',
          true,
        );
        return;
      }
      try {
        await completeFirebasePhoneSignIn(code);
      } catch (e) {
        setAuthMsg(formatPhoneUserMessage(e), true);
      }
    });

    document.getElementById('btn-email').addEventListener('click', async () => {
      setAuthMsg('');
      clearKeycloakSession();
      authSource = null;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        setAuthMsg('Enter email and password.', true);
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        setAuthMsg(formatAuthError(e), true);
      }
    });

    document.getElementById('btn-out').addEventListener('click', async () => {
      if (authSource === 'keycloak') {
        signOutKeycloak();
        return;
      }
      await signOut(auth);
      authSource = null;
      applySignedOutUi();
    });

    const authReady = initAuth();

    onAuthStateChanged(auth, async (user) => {
      await authReady;
      if (authSource === 'keycloak') return;
      if (user) {
        clearKeycloakSession();
        authSource = 'firebase';
        await enterVolunteerApp();
      } else if (!authSource) {
        applySignedOutUi();
      }
    });
  </script>
</body>
</html>
